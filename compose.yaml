services:
  api:
    image: python-samples-flask-restful
    container_name: flask-app
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "9000:9000"
    volumes:
      - storage:/storage/
    environment:
      - PYTHONUNBUFFERED=1
      - STORAGE_PATH=/storage/players-sqlite3.db
      - DATABASE_URL=sqlite+aiosqlite:////storage/players-sqlite3.db
    restart: unless-stopped

volumes:
  storage:
    name: python-samples-flask-restful_storage
